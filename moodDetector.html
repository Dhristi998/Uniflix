<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Detector - UniFlix</title>
    <link rel="icon" href="icons/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="moodDetector.css">
    <script defer src="face-api.min.js"></script>
    <script defer src="mood.js"></script>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            height: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow-x: hidden;
            color: antiquewhite;
        }
        header { text-align: center; margin-bottom: 16px; }
        header h1 { font-size: clamp(1.3rem, 4vw, 2rem); }
        .camera {
            position: relative;
            width: min(640px, 100%);
            aspect-ratio: 4 / 3;
            background: #111;
            border-radius: 0.5rem;
            overflow: hidden;
            transform: scaleX(-1); /* mirror like a selfie camera */
        }
        .camera video, .camera canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            max-height: none;
            object-fit: cover;
            border-radius: 0;
        }
        #status {
            margin-top: 14px;
            min-height: 1.5em;
            text-align: center;
            font-size: 1.05rem;
        }
        #status strong { color: hsl(181, 100%, 60%); text-transform: capitalize; }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        button {
            margin-top: 16px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: white;
            color: black;
            border: none;
            border-radius: 0.4rem;
            cursor: pointer;
        }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        button:not(:disabled):hover {
            background: hsl(181, 100%, 44%, 0.8);
            transition: 0.3s all linear;
        }
        .back { color: antiquewhite; margin-top: 16px; align-self: center; }
        .privacy { margin-top: 18px; font-size: 0.85rem; opacity: 0.7; text-align: center; max-width: 520px; }
    </style>
</head>
<body>
    <header>
        <h1>Place your face in the centre of the frame</h1>
    </header>
    <div class="camera" id="camera">
        <video id="video" autoplay muted playsinline></video>
    </div>
    <p id="status">Loading the emotion model…</p>
    <div class="actions">
        <button id="captureBtn" disabled>Capture Emotion</button>
        <a class="back" href="main.html">Back to movies</a>
    </div>
    <p class="privacy">Your camera feed is analysed entirely in your browser. No images or video are uploaded or stored.</p>
</body>
</html>
