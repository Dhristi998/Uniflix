<!DOCTYPE html>
<html>

<head>
  <title>Reset Password - UniFlix</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="forgot-password.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="icons/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="responsive.css">
  <style>
    /* Clean, centred layout that works on every screen size */
    html, body { height: auto; min-height: 100vh; overflow-x: hidden; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 110px 16px 40px; box-sizing: border-box; }
    .head { position: fixed; top: 0; left: 0; width: 100%; height: auto; display: block; z-index: 5; }
    .head nav { position: static; box-sizing: border-box; }
    .head .smedia { position: fixed; bottom: 16px; right: 16px; }
    body > h1 { font-size: 32px; padding: 0 0 18px; text-align: center; }
    form.form-box { width: min(420px, 100%); height: auto; padding: 28px 24px; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: stretch; gap: 12px;
      border: 2px solid rgba(255,255,255,0.6); border-radius: 16px; }
    form.form-box label { color: white; font-size: 16px; }
    form.form-box input.input { width: 100%; height: 44px; margin: 0; padding: 0 12px; box-sizing: border-box;
      font-size: 16px; color: white; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.5); border-radius: 8px; }
    form.form-box button { position: static; width: 100%; top: auto; left: auto; transform: none; height: 44px; font-size: 16px; border: none; border-radius: 8px; background: white; color: black; cursor: pointer; }
    .head nav a, .head nav a:visited { color: white; text-decoration: none; font-size: 15px; }
    .head nav .ul1 { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: flex-end; }
    .head nav .icon { width: 34px; height: 34px; }
    #reset-message { color: white; font-size: 15px; max-width: 420px; }
  </style>
</head>


<body>
  <div id="preloader"></div>
  <div class="blob" id="blob"></div>
  <h1>Forgot Password</h1>
  <form action="#" method="post" class="form-box">
    <label for="email" >Email</label>
    <input type="email" id="email" name="email" required class="input"/>

    <button type="submit" class="span1">Submit</button>
  </form>
  
  <div class="head">
    <nav>
      <a href="UniFlix.html">
        <img class="icon" src="icons/icon.png">
      </a>
      <ul class="ul1">
        <li class="li1">
          <a class="a1" href="premium.html">
            Premium
          </a>
        </li>
        <li class="li1">
          <a class="a1" href="download.html">
            Download
          </a>
        </li>
        <li class="li1">
          <a class="a1" href="aboutus.html">
            About us
          </a>
        </li>
        <li class="li1">
          <a class="a1" href="contactus.html">
            Contact Us
          </a>
        </li>
      </ul>
    </nav>
    <div class="smedia">
      <ul class="ul2">
                <li class="li2">
                    <a class="a2" href="https://www.linkedin.com/in/dhristipalresha/" target="_blank" rel="noopener" aria-label="LinkedIn">
                        <span class="span2">
                            <i class="fa-brands fa-linkedin-in"></i>
                        </span>
                    </a>
                </li>
                <li class="li2">
                    <a class="a2" href="https://github.com/Dhristi998" target="_blank" rel="noopener" aria-label="GitHub">
                        <span class="span2">
                            <i class="fa-brands fa-github"></i>
                        </span>
                    </a>
                </li>
            </ul>
  </div>
</div>
    <p id="reset-message" role="status" style="text-align:center;margin-top:12px;"></p>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
      import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
      import { firebaseConfig, isFirebaseConfigured } from "./js/firebase-config.js";

      window.addEventListener("load", () => {
        const loader = document.getElementById("preloader");
        setTimeout(() => { if (loader) loader.style.display = "none"; }, 800);
      });
      const blob = document.getElementById("blob");
      window.onpointermove = ({ clientX, clientY }) => {
        blob.animate({ left: `${clientX}px`, top: `${clientY}px` }, { duration: 2500, fill: "forwards" });
      };

      const message = document.getElementById("reset-message");
      document.querySelector("form").addEventListener("submit", (event) => {
        event.preventDefault();
        const email = document.getElementById("email").value.trim();
        if (!isFirebaseConfigured) {
          message.textContent = "Accounts are not set up on this demo yet.";
          return;
        }
        sendPasswordResetEmail(getAuth(initializeApp(firebaseConfig)), email)
          .then(() => { message.textContent = "If an account exists for that email, a reset link is on its way."; })
          .catch(() => { message.textContent = "Couldn't send the reset email. Check the address and try again."; });
      });
    </script>
</body>

</html>
